<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGPT</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #222;
        }
        header {
            height: 64px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            padding: 10px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .logo {
            font-size: 21px;
            font-weight: bold;
        }
        .header-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-button {
            padding: 9px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            color: #222;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .header-button:hover {
            background: #f0f0f0;
        }
        .header-button:disabled {
            background: #eee;
            color: #888;
            cursor: not-allowed;
        }
        .main-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background: #fff;
            border-right: 1px solid #ddd;
            padding: 15px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .sidebar-title {
            font-size: 14px;
            font-weight: bold;
            color: #555;
            margin-bottom: 12px;
        }
        .pdf-status {
            background: #f5f5f5;
            border: 1px solid #e3e3e3;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 12px;
            display: none;
        }
        .pdf-status-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .pdf-status-file {
            word-break: break-word;
            color: #555;
        }
        .history-item {
            padding: 10px;
            margin-bottom: 6px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: 0.2s;
        }
        .history-item:hover {
            background: #f0f0f0;
        }
        .history-item.active {
            background: #e8e8e8;
            font-weight: bold;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .history-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .delete-chat-button {
            flex: 0 0 auto;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            opacity: 0;
            padding: 3px 5px;
            border-radius: 5px;
        }
        .history-item:hover .delete-chat-button,
        .history-item.active .delete-chat-button {
            opacity: 1;
        }
        .delete-chat-button:hover {
            background: #e5e5e5;
        }
        .edit-chat-button {
            flex: 0 0 auto;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            opacity: 1;
            padding: 3px 5px;
            border-radius: 5px;
        }
        .history-item:hover .edit-chat-button,
        .history-item.active .edit-chat-button {
            opacity: 1;
        }
        .edit-chat-button:hover {
            background: #e5e5e5;
        }
        .empty-history {
            color: #888;
            font-size: 13px;
            padding: 8px 2px;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 100px 20px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 850px;
            margin: 0 auto 20px auto;
            padding: 15px 20px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }
        .message.user {
            background: #e8f0fe;
        }
        .message.ai {
            background: #ffffff;
            border: 1px solid #e2e2e2;
        }
        .message-name {
            font-weight: bold;
            margin-bottom: 8px;
        }
        .message p {
            margin-top: 8px;
            margin-bottom: 8px;
        }
        .message ul,
        .message ol {
            padding-left: 25px;
        }
        .message blockquote {
            border-left: 4px solid #ccc;
            padding-left: 12px;
            margin-left: 0;
            color: #555;
        }
        .message code {
            background: #eeeeee;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }
        .message pre {
            background: #1e1e1e;
            color: white;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .message pre code {
            background: none;
            padding: 0;
            color: inherit;
        }
        .message table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            display: block;
            overflow-x: auto;
        }
        .message th,
        .message td {
            border: 1px solid #ccc;
            padding: 8px 10px;
            text-align: left;
        }
        .message th {
            background: #f0f0f0;
            font-weight: bold;
        }
        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }
        .typing span {
            width: 7px;
            height: 7px;
            background: #777;
            border-radius: 50%;
            animation: typingAnimation 1.2s infinite;
        }
        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes typingAnimation {
            0%,
            60%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }
        .pdf-info {
            margin-top: 10px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        .input-area {
            background: #ffffff;
            border-top: 1px solid #ddd;
            padding: 14px 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .study-controls {
           width: min(850px, 90%);
           display: flex;
           align-items: center;
           justify-content: flex-end;
           gap: 8px;
           margin-bottom: 8px;
       }
   #study-mode-toggle,
   #study-level {
       padding: 8px 10px;
       border: 1px solid #ccc;
       border-radius: 8px;
       background: #fff;
       color: #222;
       cursor: pointer;
   }

   #study-mode-toggle.study-mode-active {
       font-weight: bold;
   }

   .input-wrapper {
            width: min(850px, 90%);
            display: flex;
            gap: 10px;
        }
        #message {
            flex: 1;
            min-width: 0;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        #message:focus {
            border-color: #888;
        }
        #message:disabled {
            background: #f3f3f3;
        }
 
       #voice-button {
           width: 52px;
           min-width: 52px;
           border: 1px solid #ccc;
           border-radius: 10px;
           background: #fff;
           color: #222;
           font-size: 22px;
           cursor: pointer;
           transition: 0.2s;
       }

       #voice-button:hover {
           background: #f0f0f0;
       }

       #voice-button.recording {
           background: #222;
           color: #fff;
       }

       #voice-button:disabled {
           background: #eee;
           color: #999;
           cursor: not-allowed;
       }

       #send-button {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
            min-width: 82px;
        }
        #send-button:hover {
            background: #444;
        }
        #send-button:disabled {
            background: #999;
            cursor: not-allowed;
        }
        .welcome {
            text-align: center;
            max-width: 700px;
            margin: 80px auto 30px auto;
            color: #555;
        }
        .welcome h1 {
            color: #222;
            margin-bottom: 8px;
        }
        .welcome p {
            margin-top: 0;
        }
        .welcome-features {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }
        .feature {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
        }
        @media (max-width: 700px) {
            header {
                padding: 10px 12px;
            }
            .logo {
                font-size: 18px;
            }
            .header-button {
                padding: 8px 9px;
                font-size: 12px;
            }
            .sidebar {
                width: 190px;
            }
            #chat-box {
                padding: 20px 10px 90px 10px;
            }
            .message {
                padding: 13px 15px;
            }
            .input-wrapper {
                width: 100%;
            }
            #message {
                font-size: 14px;
            }
            #send-button {
                padding: 12px 14px;
            }
        }
    </style>

<style id="edugpt-modern-theme">

:root {
    --eg-bg: #151b26;
    --eg-sidebar: #18202d;
    --eg-panel: #1d2533;
    --eg-panel2: #232d3d;
    --eg-border: rgba(255,255,255,0.08);
    --eg-text: #f3f5fb;
    --eg-muted: #98a4b7;
    --eg-purple: #7667e8;
    --eg-purple2: #9a89ff;
}

html,
body {
    background: var(--eg-bg) !important;
    color: var(--eg-text) !important;
}

body {
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif !important;
}

/* ============================================================
   HEADER
   ============================================================ */

header {
    background: #171e2b !important;
    border-bottom: 1px solid var(--eg-border) !important;
    box-shadow: none !important;
}

/* ============================================================
   TOP SEARCH
   ============================================================ */

.global-search-wrap {
    position: relative !important;
    width: min(760px, 100%) !important;
    margin: 0 auto !important;
}

.global-search {
    width: 100% !important;
    height: 52px !important;
    box-sizing: border-box !important;

    background: #222b3a !important;
    color: #f3f5fb !important;

    border: 1px solid rgba(255,255,255,0.04) !important;
    border-radius: 14px !important;

    padding: 0 20px 0 52px !important;

    font-size: 15px !important;
    outline: none !important;
}

.global-search::placeholder {
    color: #8d99ab !important;
}

.global-search:focus {
    border-color: rgba(118,103,232,0.65) !important;
    box-shadow: 0 0 0 3px rgba(118,103,232,0.10) !important;
}

.global-search-icon {
    position: absolute !important;
    left: 18px !important;
    top: 10px !important;

    color: #98a4b7 !important;
    font-size: 25px !important;

    z-index: 5 !important;
    pointer-events: none !important;
}

/* ============================================================
   HEADER BUTTONS
   ============================================================ */

.header-button {
    background: #222b3a !important;
    color: #f2f4fa !important;

    border: 1px solid var(--eg-border) !important;
    border-radius: 13px !important;

    box-shadow: 0 6px 20px rgba(0,0,0,0.12) !important;

    font-weight: 600 !important;
}

.header-button:hover {
    background: #2b3547 !important;
    border-color: rgba(255,255,255,0.14) !important;
}

/* ============================================================
   MAIN AREA
   ============================================================ */

.main-container {
    background: var(--eg-bg) !important;
}

.chat-area {
    background:
        radial-gradient(
            circle at 60% 35%,
            rgba(110,93,220,0.08),
            transparent 34%
        ),
        #151b26 !important;
}

/* ============================================================
   SIDEBAR
   ============================================================ */

.sidebar {
    background: var(--eg-sidebar) !important;

    border-right:
        1px solid var(--eg-border) !important;
}

.sidebar-nav {
    display: flex !important;
    flex-direction: column !important;
    gap: 5px !important;

    margin-bottom: 18px !important;
}

.sidebar-nav-item {
    min-height: 47px !important;

    display: flex !important;
    align-items: center !important;

    gap: 15px !important;

    padding: 0 17px !important;

    border-radius: 10px !important;

    color: #c7cfdd !important;

    font-size: 15px !important;

    cursor: pointer !important;

    transition: 0.18s ease !important;
}

.sidebar-nav-item:hover {
    background: #232d3d !important;
    color: white !important;
}

.sidebar-nav-item.active {
    background: #293447 !important;
    color: white !important;
}

.sidebar-nav-item span:first-child {
    width: 22px !important;

    text-align: center !important;

    font-size: 21px !important;
}

.sidebar-divider {
    height: 1px !important;

    background:
        rgba(255,255,255,0.08) !important;

    margin:
        4px 4px 20px !important;
}

.sidebar-title {
    color: #dce2ed !important;

    font-size: 14px !important;

    font-weight: 600 !important;
}

/* ============================================================
   CHAT HISTORY
   ============================================================ */

.history-item {
    color: #bec8d7 !important;

    background: transparent !important;

    border-radius: 9px !important;

    transition: 0.15s ease !important;
}

.history-item:hover {
    background: #232d3d !important;
}

.history-item.active {
    background: #2a3547 !important;

    color: white !important;
}

/* ============================================================
   WELCOME AREA
   ============================================================ */

.welcome {
    color: #98a4b7 !important;
}

.welcome h1 {
    color: #f4f6fb !important;

    font-size: 34px !important;

    letter-spacing: -0.8px !important;
}

.welcome p {
    color: #8f9bae !important;
}

/* ============================================================
   FEATURE CARDS
   ============================================================ */

.feature {
    background: #202938 !important;

    border:
        1px solid var(--eg-border) !important;

    color: #dbe2ed !important;

    border-radius: 13px !important;

    box-shadow:
        0 6px 20px rgba(0,0,0,0.08) !important;
}

.feature:hover {
    background: #263143 !important;
}

/* ============================================================
   CHAT MESSAGES
   ============================================================ */

.message {
    color: #e9edf5 !important;

    border-radius: 15px !important;
}

.message.user {
    background: #273244 !important;
}

.message.ai {
    background: #202938 !important;

    border:
        1px solid var(--eg-border) !important;
}

/* ============================================================
   INPUT AREA
   ============================================================ */

.input-area {
    background:
        rgba(21,27,38,0.97) !important;

    border-top:
        1px solid var(--eg-border) !important;

    backdrop-filter:
        blur(14px) !important;
}

.input-wrapper {
    gap: 12px !important;
}

/* TEXT INPUT */

#message {
    height: 58px !important;

    background: #1c2533 !important;

    color: #f1f4fa !important;

    border:
        1px solid rgba(255,255,255,0.10) !important;

    border-radius: 14px !important;

    padding: 0 18px !important;

    font-size: 15px !important;

    outline: none !important;
}

#message::placeholder {
    color: #8490a3 !important;
}

#message:focus {
    border-color:
        rgba(118,103,232,0.65) !important;

    box-shadow:
        0 0 0 3px rgba(118,103,232,0.10) !important;
}

/* ============================================================
   STUDY MODE
   ============================================================ */

.study-controls {
    display: flex !important;

    align-items: center !important;

    gap: 10px !important;

    margin-bottom: 8px !important;
}

#study-mode-toggle,
#study-level {
    min-height: 48px !important;

    background: #202938 !important;

    color: #e8ecf5 !important;

    border:
        1px solid rgba(255,255,255,0.09) !important;

    border-radius: 12px !important;
}

#study-mode-toggle {
    padding: 0 22px !important;

    font-weight: 600 !important;
}

#study-mode-toggle.study-mode-active {
    background:
        linear-gradient(
            135deg,
            #554bb9,
            #7567e9
        ) !important;

    color: white !important;

    border-color: transparent !important;
}

#study-level {
    padding: 0 38px 0 15px !important;
}

/* ============================================================
   MICROPHONE
   ============================================================ */

#voice-button {
    height: 58px !important;

    width: 58px !important;

    min-width: 58px !important;

    border-radius: 14px !important;

    border:
        1px solid rgba(255,255,255,0.10) !important;

    background: #202938 !important;

    color: #e6ebf4 !important;

    font-size: 22px !important;

    cursor: pointer !important;

    transition: 0.18s ease !important;
}

#voice-button:hover {
    background: #2b3547 !important;

    transform: translateY(-1px);
}

#voice-button.recording {
    background: #7667e8 !important;

    color: white !important;

    border-color: transparent !important;

    box-shadow:
        0 0 0 5px rgba(118,103,232,0.15) !important;
}

/* ============================================================
   SEND BUTTON
   ============================================================ */

#send-button {
    height: 58px !important;

    min-width: 128px !important;

    border: none !important;

    border-radius: 14px !important;

    background:
        linear-gradient(
            135deg,
            #7467e9,
            #8e7cf4
        ) !important;

    color: white !important;

    font-size: 15px !important;

    font-weight: 600 !important;

    box-shadow:
        0 10px 24px rgba(93,78,190,0.24) !important;

    cursor: pointer !important;
}

#send-button:hover {
    background:
        linear-gradient(
            135deg,
            #8275ef,
            #9a89ff
        ) !important;
}

#send-button:disabled {
    background: #3a4050 !important;

    color: #8992a3 !important;

    box-shadow: none !important;
}

/* ============================================================
   PDF STATUS
   ============================================================ */

.pdf-status {
    background: #202938 !important;

    border:
        1px solid var(--eg-border) !important;

    color: #dbe2ed !important;

    border-radius: 10px !important;
}

/* ============================================================
   SCROLLBARS
   ============================================================ */

::-webkit-scrollbar {
    width: 8px;
    height: 8px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #394457;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: #4a566c;
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 1000px) {

    .sidebar {
        width: 250px !important;
    }

    .global-search-wrap {
        width: 90% !important;
    }

}

@media (max-width: 700px) {

    .sidebar {
        width: 205px !important;
    }

    #send-button {
        min-width: 85px !important;
    }

    #voice-button {
        width: 52px !important;
        min-width: 52px !important;
    }

}

</style>


<style id="edugpt-clean-sidebar">

/* ==========================================================
   CLEAN FUNCTIONAL SIDEBAR
   ========================================================== */

.edugpt-sidebar-nav {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin: 0 0 16px 0;
    padding: 0;
}

.edugpt-sidebar-nav button {
    width: 100%;
    height: 40px;
    min-height: 40px;

    display: flex;
    align-items: center;

    gap: 12px;

    padding: 0 12px;

    border: 0;
    border-radius: 9px;

    background: transparent;

    color: #c7cfdd;

    font-family: inherit;
    font-size: 13px;
    font-weight: 500;

    text-align: left;

    cursor: pointer;

    transition:
        background .15s ease,
        color .15s ease;
}

.edugpt-sidebar-nav button:hover {
    background: #252f40;
    color: #ffffff;
}

.edugpt-sidebar-nav button.active {
    background: #293447;
    color: #ffffff;

    box-shadow:
        inset 3px 0 0 #7667e8;
}

.edugpt-sidebar-nav .nav-icon {
    width: 22px;
    min-width: 22px;

    text-align: center;

    font-size: 18px;
}

.edugpt-sidebar-nav .nav-label {
    flex: 1;
}

/* ==========================================================
   NAVIGATION PANEL
   ========================================================== */

#edugpt-nav-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.58);

    backdrop-filter: blur(3px);

    z-index: 9998;

    display: none;
}

#edugpt-nav-overlay.open {
    display: block;
}

#edugpt-nav-panel {
    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(620px, calc(100vw - 30px));

    max-height: calc(100vh - 60px);

    overflow-y: auto;

    background: #202938;

    color: #ffffff;

    border:
        1px solid rgba(255,255,255,.10);

    border-radius: 16px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.50);

    z-index: 9999;

    display: none;
}

#edugpt-nav-panel.open {
    display: block;
}

.edugpt-nav-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 16px 18px;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.edugpt-nav-title {
    font-size: 18px;
    font-weight: 650;
}

.edugpt-nav-close {
    width: 34px;
    height: 34px;

    border: 0;

    border-radius: 8px;

    background: #303b4d;

    color: #ffffff;

    font-size: 20px;

    cursor: pointer;
}

.edugpt-nav-close:hover {
    background: #3b475b;
}

.edugpt-nav-body {
    padding: 18px;
}

.edugpt-nav-card {
    width: 100%;

    padding: 14px;

    margin-bottom: 9px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 11px;

       function getSupportedAudioMimeType() {
           const types = [
               "audio/webm;codecs=opus",
               "audio/webm",
               "audio/mp4"
           ];

           for (const type of types) {
               if (
                   window.MediaRecorder &&
                   MediaRecorder.isTypeSupported &&
                   MediaRecorder.isTypeSupported(type)
               ) {
                   return type;
               }
           }

           return "";
       }


       async function toggleVoiceRecording() {

           if (isRecording) {
               stopVoiceRecording();
               return;
           }

           if (
               !navigator.mediaDevices ||
               !navigator.mediaDevices.getUserMedia
           ) {
               alert(
                   "Microphone access is not supported by this browser."
               );
               return;
           }

           if (!window.MediaRecorder) {
               alert(
                   "Audio recording is not supported by this browser."
               );
               return;
           }

           try {

               const stream =
                   await navigator.mediaDevices.getUserMedia({
                       audio: true
                   });

               const mimeType =
                   getSupportedAudioMimeType();

               mediaRecorder =
                   mimeType
                       ? new MediaRecorder(
                           stream,
                           { mimeType: mimeType }
                       )
                       : new MediaRecorder(stream);

               audioChunks = [];
               isRecording = true;

               voiceButton.classList.add("recording");

               voiceButton.textContent = "⏹️";

               voiceButton.title =
                   "Stop recording";

               voiceButton.setAttribute(
                   "aria-label",
                   "Stop recording"
               );


               mediaRecorder.ondataavailable =
                   function(event) {

                       if (
                           event.data &&
                           event.data.size > 0
                       ) {
                           audioChunks.push(
                               event.data
                           );
                       }

                   };


               mediaRecorder.onstop =
                   async function() {

                       stream
                           .getTracks()
                           .forEach(
                               track => track.stop()
                           );

                       const recordedType =
                           mediaRecorder.mimeType ||
                           mimeType ||
                           "audio/webm";

                       const audioBlob =
                           new Blob(
                               audioChunks,
                               {
                                   type: recordedType
                               }
                           );

                       audioChunks = [];

                       if (audioBlob.size === 0) {

                           resetVoiceButton();

                           alert(
                               "No audio was recorded. Please try again."
                           );

                           return;
                       }

                       await transcribeVoice(
                           audioBlob
                       );

                   };


               mediaRecorder.start();

           } catch (error) {

               console.error(
                   "Microphone error:",
                   error
               );

               resetVoiceButton();

               if (
                   error.name ===
                   "NotAllowedError"
               ) {

                   alert(
                       "Microphone permission was denied. " +
                       "Please allow microphone access for " +
                       "127.0.0.1 and try again."
                   );

               } else {

                   alert(
                       "Could not access the microphone: " +
                       (
                           error.message ||
                           "Unknown error"
                       )
                   );

               }

           }

       }


       function stopVoiceRecording() {

           if (
               mediaRecorder &&
               mediaRecorder.state !==
               "inactive"
           ) {

               mediaRecorder.stop();

           } else {

               resetVoiceButton();

           }

       }


       function resetVoiceButton() {

           isRecording = false;

           voiceButton.classList.remove(
               "recording"
           );

           voiceButton.textContent = "🎤";

           voiceButton.title =
               "Voice input";

           voiceButton.setAttribute(
               "aria-label",
               "Voice input"
           );

       }


       async function transcribeVoice(
           audioBlob
       ) {

           try {

               voiceButton.disabled = true;

               voiceButton.textContent = "⏳";


               const formData =
                   new FormData();

               formData.append(
                   "audio",
                   audioBlob,
                   "edugpt-recording.webm"
               );


               const response =
                   await fetch(
                       "/transcribe-audio",
                       {
                           method: "POST",
                           body: formData
                       }
                   );


               let data = {};

               try {

                   data =
                       await response.json();

               } catch {

                   throw new Error(
                       "The transcription server returned an invalid response."
                   );

               }


               if (!response.ok) {

                   throw new Error(
                       data.error ||
                       "Voice transcription failed."
                   );

               }


               const transcript =
                   String(
                       data.text || ""
                   ).trim();


               if (!transcript) {

                   throw new Error(
                       "No speech was detected. Please try again."
                   );

               }


               input.value =
                   transcript;

               input.focus();


           } catch (error) {

               console.error(
                   "Voice transcription error:",
                   error
               );

               alert(
                   error.message ||
                   "Could not transcribe the recording."
               );

           } finally {

               voiceButton.disabled =
                   false;

               resetVoiceButton();

               input.focus();

           }

       }


       async function sendMessage() {

                return;
            }

            input.value = "";
            setLoading(true);

                let data;

                        await response.json();
                } catch {
                    throw new Error(
                        "The server returned an invalid response."
                    );
                }
                if (!response.ok) {
                    throw new Error(
                        data.error ||
                        data.response ||
                        data.message ||
                        "Server error: " +
                        response.status
                    );
                }
                removeTypingMessage();
                const aiResponse =
                    data.response ||
                    "I could not generate a response."; 
                addAIMessage(aiResponse);
                await loadChatHistory();
            } catch (error) {
                console.error(
                    "Chat error:",
                    error
                );
                removeTypingMessage();
                addAIMessage(
                    "❌ " +
                    escapeHtml(
                        error.message ||
                        "Something went wrong."
                    )
                );
            }
            setLoading(false);
            input.focus();
        }

        async function loadChatHistory() {
            try {
                const response =
                    await fetch(
                        "/chat-history"
                    );

                    throw new Error(
                        "Could not load chat history."
                    );

                const history =

                        document.createElement(

                        );
                    empty.className =
                        "empty-history";
                    empty.textContent =

                    historyList.appendChild(

                    return;
                }
                history.forEach(

                        const item =
                            document.createElement(
                                "div"
                            );
                        item.className =
                            "history-item";
                        item.dataset.chatId =
                            String(chat.chat_id);

                        ) {

                        const title =

                        title.className =
                            "history-title";
                        title.textContent =
                            chat.title ||
                            "New Chat";
                        item.title =
                            chat.title ||
                            "New Chat";
                        title.addEventListener(

                        item.appendChild(title);

                        const deleteButton =

        async function renameChat(selectedChatId, titleElement) {
            const currentTitle =
                titleElement.textContent.trim() ||
                "New Chat";
            const newTitle = prompt(
                "Enter a new name for this chat:",
                currentTitle
            );
            if (newTitle === null) {
                return;
            }
            const cleanedTitle = newTitle.trim();
            if (!cleanedTitle) {
                alert("Chat name cannot be empty.");
                return;
            }
            try {
                const response = await fetch(
                    "/rename-chat/" +

        document.addEventListener("click", function(event) {
            const button =
                event.target.closest(".edit-chat-button");
            if (!button) {
                return;
            }
            event.preventDefault();
            event.stopPropagation();
            const chatId =
                button.dataset.chatId;
            if (!chatId) {
                console.error("Rename button has no chat ID.");
                return;
            }
            const item =
                button.closest(".chat-history-item") ||
                button.parentElement;
            const titleElement =
                item.querySelector(".history-title");
            if (!titleElement) {
                console.error("Chat title element not found.");
                return;
            }
            beginRenameFromButton(
                chatId,
                titleElement,
                button
            );
        }, true);
        function beginRenameFromButton(
            chatId,
            titleElement,
            button
        ) {
            if (
                titleElement.dataset &&
                titleElement.dataset.renaming === "true"
            ) {
                return;
            }
            const oldTitle =
                titleElement.textContent.trim() ||
                "New Chat";
            const input =
                document.createElement("input");
            input.type = "text";
            input.value = oldTitle;
            input.maxLength = 80;
            input.style.width = "100%";
            input.style.boxSizing = "border-box";
            input.style.padding = "6px 8px";
            input.style.border = "2px solid #555";
            input.style.borderRadius = "6px";
            input.style.fontSize = "14px";
            input.style.fontFamily = "inherit";
            input.style.background = "#fff";
            input.style.color = "#111";
            titleElement.dataset.renaming = "true";
            titleElement.replaceWith(input);
            button.textContent = "✓";
            button.title = "Save name";
            button.setAttribute(
                "aria-label",
                "Save name"
            );
            input.focus();
            input.select();
            let saving = false;
            async function save() {
                if (saving) {
                    return;
                }
                const newTitle =
                    input.value.trim();
                if (!newTitle) {
                    alert("Chat name cannot be empty.");
                    input.focus();
                    return;
                }
                saving = true;
                button.disabled = true;
                try {
                    const response = await fetch(
                        "/rename-chat/" +
                        encodeURIComponent(chatId),
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify({
                                title: newTitle
                            })
                        }
                    );
                    const data =
                        await response.json();
                    console.log(
                        "Rename response:",
                        data
                    );
                    if (!response.ok) {
                        throw new Error(
                            data.error ||
                            "Rename failed."
                        );
                    }
                    // Reload sidebar so MongoDB's saved title appears.
                    await loadChatHistory();
                } catch (error) {
                    console.error(
                        "Rename failed:",
                        error
                    );
                    alert(
                        "Rename failed: " +
                        error.message
                    );
                    button.disabled = false;
                    saving = false;
                    input.focus();
                }
            }
            input.addEventListener(
                "keydown",
                function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        save();
                    }
                    if (event.key === "Escape") {
                        event.preventDefault();
                        loadChatHistory();
                    }
                }
            );
            button.addEventListener(
                "click",
                function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    save();
                },
                { once: true }
            );
        }
    </script>

<script id="edugpt-feature-buttons-js">

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "EduGPT feature buttons loaded"
        );


        /* ====================================================
           HELPER
           ==================================================== */

        function getFeatureText(element) {

            return element.textContent
                .replace("›", "")
                .trim()
                .toLowerCase();

        }


        function getChatInput() {

            return document.getElementById(
                "message"
            );

        }


        function getChatBox() {

            return document.getElementById(
                "chat-box"
            );

        }


        function scrollChat() {

            const chatBox =
                getChatBox();

            if (chatBox) {

                chatBox.scrollTo({
                    top: chatBox.scrollHeight,
                    behavior: "smooth"
                });

            }

        }


        function escapeHTML(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                value ?? "";

            return div.innerHTML;

        }


        /* ====================================================
           AI CHAT
           ==================================================== */

        function openAIChat() {

            const input =
                getChatInput();

            if (!input) {

                alert(
                    "Chat input was not found."
                );

                return;

            }

            input.focus();

            input.placeholder =
                "Ask EduGPT something...";

            input.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        }


        /* ====================================================
           PDF UNDERSTANDING
           ==================================================== */

        function openPDFUnderstanding() {

            const pdfButton =
                document.getElementById(
                    "upload-pdf-button"
                );

            const pdfInput =
                document.getElementById(
                    "pdf-input"
                );


            if (pdfButton) {

                pdfButton.click();

                return;

            }


            if (pdfInput) {

                pdfInput.click();

                return;

            }


            alert(
                "PDF upload is not available."
            );

        }


        /* ====================================================
           SEMANTIC SEARCH
           ==================================================== */

        async function semanticSearch() {

            const question =
                window.prompt(
                    "Semantic Search\n\nEnter what you want to search for in your uploaded PDF:"
                );


            if (
                !question ||
                !question.trim()
            ) {

                return;

            }


            const chatBox =
                getChatBox();


            if (!chatBox) {

                alert(
                    "Chat area was not found."
                );

                return;

            }


            /*
             * Remove old feature result.
             */

            const oldResult =
                document.getElementById(
                    "edugpt-semantic-result"
                );

            if (oldResult) {

                oldResult.remove();

            }


            const resultBox =
                document.createElement(
                    "div"
                );

            resultBox.id =
                "edugpt-semantic-result";

            resultBox.className =
                "edugpt-feature-result";


            resultBox.innerHTML = `

                <div
                    class="edugpt-feature-result-title"
                >
                    🧠 Semantic Search
                </div>

                <div
                    class="edugpt-feature-status"
                >
                    Searching your PDF...
                </div>

            `;


            chatBox.appendChild(
                resultBox
            );

            scrollChat();


            try {

                const response =
                    await fetch(
                        "/search-pdf",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    question:
                                        question.trim()
                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Semantic search failed."
                    );

                }


                const results =
                    data.results || [];


                if (
                    results.length === 0
                ) {

                    resultBox.innerHTML = `

                        <div
                            class="edugpt-feature-result-title"
                        >
                            🧠 Semantic Search
                        </div>

                        <div
                            class="edugpt-feature-status"
                        >
                            No matching PDF content was found.
                        </div>

                    `;

                    return;

                }


                let resultHTML = `

                    <div
                        class="edugpt-feature-result-title"
                    >
                        🧠 Semantic Search
                    </div>

                    <div
                        class="edugpt-feature-status"
                    >
                        Results for:
                        <strong>
                            ${escapeHTML(question)}
                        </strong>
                    </div>

                `;


                results.forEach(
                    function (result, index) {

                        resultHTML += `

                            <div
                                class="edugpt-search-result"
                            >

                                <div
                                    class="edugpt-search-result-meta"
                                >
                                    Result ${index + 1}
                                    ·
                                    ${escapeHTML(
                                        result.filename ||
                                        "PDF"
                                    )}
                                    ·
                                    Chunk
                                    ${result.chunk_index ?? 0}
                                    ·
                                    Similarity
                                    ${result.similarity ?? "—"}
                                </div>

                                <div
                                    class="edugpt-search-result-text"
                                >
                                    ${escapeHTML(
                                        result.text || ""
                                    )}
                                </div>

                            </div>

                        `;

                    }
                );


                resultBox.innerHTML =
                    resultHTML;


                scrollChat();

            } catch (error) {

                console.error(
                    "Semantic Search error:",
                    error
                );


                resultBox.innerHTML = `

                    <div
                        class="edugpt-feature-result-title"
                    >
                        🧠 Semantic Search
                    </div>

                    <div
                        class="edugpt-feature-status"
                    >
                        ❌
                        ${escapeHTML(
                            error.message ||
                            "Search failed."
                        )}
                    </div>

                `;

            }

        }


        /* ====================================================
           RAG
           ==================================================== */

        async function runRAG() {

            const question =
                window.prompt(
                    "RAG\n\nAsk a question about your uploaded PDF:"
                );


            if (
                !question ||
                !question.trim()
            ) {

                return;

            }


            const chatBox =
                getChatBox();


            if (!chatBox) {

                alert(
                    "Chat area was not found."
                );

                return;

            }


            /*
             * Add the student's question to the chat.
             */

            const userMessage =
                document.createElement(
                    "div"
                );

            userMessage.className =
                "message user";


            userMessage.innerHTML = `

                <div class="message-name">
                    You
                </div>

                <div>
                    ${escapeHTML(
                        question
                    )}
                </div>

            `;


            const welcome =
                document.getElementById(
                    "welcome-message"
                );

            if (welcome) {

                welcome.remove();

            }


            chatBox.appendChild(
                userMessage
            );


            const typing =
                document.createElement(
                    "div"
                );

            typing.className =
                "message ai";

            typing.id =
                "edugpt-rag-typing";


            typing.innerHTML = `

                <div class="message-name">
                    EduGPT
                </div>

                <div class="typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            `;


            chatBox.appendChild(
                typing
            );

            scrollChat();


            try {

                /*
                 * The existing /chat backend performs
                 * semantic PDF retrieval and supplies
                 * relevant PDF context to Qwen.
                 */

                const response =
                    await fetch(
                        "/chat",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    message:
                                        question.trim(),

                                    pdf_filename:
                                        window.currentPdfName ||
                                        ""
                                })
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "RAG request failed."
                    );

                }


                const oldTyping =
                    document.getElementById(
                        "edugpt-rag-typing"
                    );


                if (oldTyping) {

                    oldTyping.remove();

                }


                const answer =
                    document.createElement(
                        "div"
                    );

                answer.className =
                    "message ai";


                answer.innerHTML = `

                    <div class="message-name">
                        EduGPT · RAG
                    </div>

                    <div class="ai-content">
                        ${data.response ||
                          "No response was returned."}
                    </div>

                `;


                chatBox.appendChild(
                    answer
                );


                scrollChat();


            } catch (error) {

                console.error(
                    "RAG error:",
                    error
                );


                const oldTyping =
                    document.getElementById(
                        "edugpt-rag-typing"
                    );


                if (oldTyping) {

                    oldTyping.remove();

                }


                const errorMessage =
                    document.createElement(
                        "div"
                    );

                errorMessage.className =
                    "message ai";


                errorMessage.innerHTML = `

                    <div class="message-name">
                        EduGPT
                    </div>

                    <div class="ai-content">
                        ❌
                        ${escapeHTML(
                            error.message ||
                            "RAG request failed."
                        )}
                    </div>

                `;


                chatBox.appendChild(
                    errorMessage
                );


                scrollChat();

            }

        }


        /* ====================================================
           MAKE THE FOUR FEATURES CLICKABLE
           ==================================================== */

        document
            .querySelectorAll(
                ".welcome-features .feature"
            )
            .forEach(
                function (feature) {

                    feature.setAttribute(
                        "role",
                        "button"
                    );

                    feature.setAttribute(
                        "tabindex",
                        "0"
                    );


                    feature.addEventListener(
                        "click",
                        function () {

                            const text =
                                getFeatureText(
                                    feature
                                );


                            if (
                                text.includes(
                                    "ai chat"
                                )
                            ) {

                                openAIChat();

                                return;

                            }


                            if (
                                text.includes(
                                    "pdf understanding"
                                )
                            ) {

                                openPDFUnderstanding();

                                return;

                            }


                            if (
                                text.includes(
                                    "semantic search"
                                )
                            ) {

                                semanticSearch();

                                return;

                            }


                            if (
                                text.includes(
                                    "rag"
                                )
                            ) {

                                runRAG();

                                return;

                            }

                        }
                    );


                    feature.addEventListener(
                        "keydown",
                        function (event) {

                            if (
                                event.key ===
                                    "Enter" ||
                                event.key ===
                                    " "
                            ) {

                                event.preventDefault();

                                feature.click();

                            }

                        }
                    );

                }
            );


        console.log(
            "EduGPT: AI Chat, PDF Understanding, Semantic Search and RAG are functional."
        );

    }
);

</script>
